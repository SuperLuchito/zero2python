name: Ошибка
description: Воспроизводимая проблема или регрессия
title: "[Ошибка] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Шаги, окружение и обезличенные входные данные.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что происходит
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Готово, когда
      description: Наблюдаемый результат исправления и сценарий проверки регрессии.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Материалы и зависимости
      description: Связанные Issues, версия приложения и безопасные скриншоты или логи.
